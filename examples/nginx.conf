# Nginx virtual host for TidyShop Connector. Replace tidyshop.example.com and
# the two certificate paths, then run `nginx -t` before reloading.
# The snippets include is optional; drop that line if you have no such file.

server {
    listen 443 ssl;
    server_name tidyshop.example.com;

    ssl_certificate     /acme/example.com.pem;
    ssl_certificate_key /acme/example.com.key;

    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=30s;

    # Server-Sent Events: the app holds this open while it is in the foreground so
    # family list changes arrive instantly. Proxy buffering and the 30s read timeout
    # used for the REST routes would both break the stream, so this route overrides them.
    location = /v1/events {
        set $upstream http://TidyShop-Connector:8787;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Client-Id $http_x_client_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        set $upstream http://TidyShop-Connector:8787;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Client-Id $http_x_client_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

server {
    listen 80;
    server_name tidyshop.example.com;
    return 301 https://$host$request_uri;
}
