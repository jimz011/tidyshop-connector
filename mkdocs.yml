site_name: TidyShop Connector
site_description: >-
  Documentation for TidyShop Connector — the self-hosted family sharing server for the
  TidyShop shopping-list app for Android.
site_url: https://jimz011.github.io/tidyshop-connector/
site_author: Jimz011

repo_name: jimz011/tidyshop-connector
repo_url: https://github.com/jimz011/tidyshop-connector
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2026 Jimz011 &mdash;
  <a href="https://github.com/jimz011/tidyshop-connector/blob/main/LICENSE">MPL-2.0</a>.

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jimz011/tidyshop-connector
      name: TidyShop Connector on GitHub
    - icon: fontawesome/brands/docker
      link: https://github.com/jimz011/tidyshop-connector/pkgs/container/tidyshop-connector
      name: Container image
    - icon: fontawesome/solid/envelope
      link: mailto:jimz011apps@gmail.com
      name: Email the developer

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Join the beta: beta.md
      - Docker Compose: getting-started/docker.md
      - Unraid: getting-started/unraid.md
      - Reverse proxy and HTTPS: getting-started/reverse-proxy.md
      - Connect the app: getting-started/connect-app.md
  - Guide:
      - guide/index.md
      - Members and invites: guide/members.md
      - Recovery and the pairing key: guide/recovery.md
      - Single sign-on: guide/sso.md
      - Backups and updates: guide/maintenance.md
  - Reference:
      - reference/index.md
      - Configuration: reference/configuration.md
      - HTTP API: reference/api.md
      - Changelog: reference/changelog.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
